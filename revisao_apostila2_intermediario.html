<style>
  :root{
    --azul:#0d3b6e;
    --teal:#1a9a8a;
    --ouro:#f5c842;
    --bg:#f5f7fa;
    --card:#ffffff;
    --text:#26313f;
    --muted:#6b7686;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,var(--azul),#124a86);
    color:#fff;
    padding:28px 20px 22px;
    text-align:center;
  }
  header h1{margin:0 0 6px;font-size:1.5rem;}
  header p{margin:0;opacity:.9;font-size:.95rem;}
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:18px 12px 4px;
    max-width:1000px;
    margin:0 auto;
  }
  .tab-btn{
    border:2px solid var(--azul);
    background:#fff;
    color:var(--azul);
    padding:9px 14px;
    border-radius:20px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .tab-btn:hover{background:#eaf1fb;}
  .tab-btn.active{
    background:var(--azul);
    color:#fff;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:14px 16px 40px;
  }
  .topic{display:none;}
  .topic.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card{
    background:var(--card);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(13,59,110,.08);
    border-left:5px solid var(--teal);
  }
  .card h2{
    color:var(--azul);
    margin-top:0;
    font-size:1.25rem;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3{
    color:var(--teal);
    font-size:1rem;
    margin-bottom:6px;
  }
  .badge{
    display:inline-block;
    background:var(--ouro);
    color:var(--azul);
    font-weight:700;
    font-size:.7rem;
    padding:3px 9px;
    border-radius:12px;
    margin-bottom:10px;
  }
  .exemplos{
    background:#eef6f5;
    border-radius:10px;
    padding:12px 16px;
    margin:10px 0;
  }
  .exemplos p{margin:6px 0;font-style:italic;}
  table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0 16px;
    font-size:.9rem;
  }
  th,td{
    border:1px solid #dbe4ee;
    padding:7px 8px;
    text-align:center;
  }
  th{
    background:var(--azul);
    color:#fff;
  }
  tr:nth-child(even){background:#f6f9fc;}
  .exercicio{
    background:#fbfbfd;
    border:1px solid #e3e8ee;
    border-radius:10px;
    padding:12px 16px;
    margin-top:14px;
  }
  .exercicio ol{padding-left:20px;margin:8px 0;}
  .exercicio li{margin-bottom:10px;line-height:1.5;}
  .reveal-btn{
    display:inline-block;
    margin-top:10px;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .reveal-btn:hover{background:#158377;}
  .gabarito{
    display:none;
    margin-top:12px;
    background:#fff9e6;
    border-left:4px solid var(--ouro);
    padding:10px 14px;
    border-radius:8px;
    font-size:.88rem;
    line-height:1.6;
  }
  .gabarito.show{display:block;}
  .nota{
    background:#eaf1fb;
    border-left:4px solid var(--azul);
    padding:10px 14px;
    border-radius:8px;
    font-size:.87rem;
    margin-top:10px;
  }
  .progresso{
    text-align:center;
    font-size:.8rem;
    color:var(--muted);
    margin-top:4px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    margin-top:20px;
  }
</style>
</head>

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

temas.forEach((tema, idx) => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (idx === 0 ? " active" : "");
  btn.textContent = tema.icone + " " + tema.titulo;
  btn.onclick = () => showTopic(idx);
  tabsEl.appendChild(btn);

  const section = document.createElement("section");
  section.className = "topic" + (idx === 0 ? " active" : "");
  section.id = "topic-" + tema.id;

  let tabelaHtml = "";
  if (tema.tabela) {
    tabelaHtml = "<table><tr>" + tema.tabela.cabecalho.map(h => `<th>${h}</th>`).join("") + "</tr>" +
      tema.tabela.linhas.map(l => "<tr>" + l.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") +
      "</table>";
  }

  const exemplosHtml = tema.exemplos.map(e => `<p>• ${e}</p>`).join("");
  const notaHtml = tema.nota ? `<div class="nota">💡 ${tema.nota}</div>` : "";

  let exercicioHtml = "";
  if (tema.exercicio) {
    const itensHtml = tema.exercicio.itens.map(it => `<li>${it}</li>`).join("");
    exercicioHtml = `
    <div class="card exercicio">
      <h2>✏️ ${tema.exercicio.titulo}</h2>
      <ol>${itensHtml}</ol>
      <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">Ver gabarito</button>
      <div class="gabarito">${tema.exercicio.gabarito}</div>
    </div>`;
  }

  const exemplosLabel = tema.exemplosLabel || "Exemplos da apostila";

  let podcastsHtml = "";
  if (tema.podcasts) {
    const linhas = tema.podcasts.map(p => `<p>🎧 <strong>${p.nome}</strong> <span class="badge" style="margin-left:6px;">${p.nivel}</span><br>${p.desc}</p>`).join("");
    podcastsHtml = `
    <div class="card">
      <h3>Podcasts recomendados para este nível</h3>
      <div class="exemplos">${linhas}</div>
    </div>`;
  }

  section.innerHTML = `
    <div class="card">
      <span class="badge">Tema ${idx+1} de ${temas.length}</span>
      <h2>${tema.icone} ${tema.titulo}</h2>
      <p>${tema.explicacao}</p>
      ${tabelaHtml}
      <h3>${exemplosLabel}</h3>
      <div class="exemplos">${exemplosHtml}</div>
      ${notaHtml}
    </div>
    ${podcastsHtml}
    ${exercicioHtml}
  `;
  mainEl.appendChild(section);
});

function showTopic(idx){
  document.querySelectorAll(".tab-btn").forEach((b,i) => b.classList.toggle("active", i===idx));
  document.querySelectorAll(".topic").forEach((s,i) => s.classList.toggle("active", i===idx));
  window.scrollTo({top:0, behavior:"smooth"});
}
</script>
