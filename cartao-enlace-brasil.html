<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlace Brasil · Cartão Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul: #0d3b6e;
    --azul-deep: #082848;
    --teal: #1a9a8a;
    --ouro: #f5c842;
    --papel: #faf6ec;
    --tinta: #1b2a33;
    --tinta-suave: #5c6b73;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, rgba(26,154,138,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(245,200,66,0.14), transparent 45%),
      var(--papel);
    font-family:'Manrope', sans-serif;
    color: var(--tinta);
    padding: 32px 16px;
  }

  .card{
    position:relative;
    width: 380px;
    max-width:100%;
    background: #fff;
    border-radius: 28px;
    padding: 44px 34px 30px;
    box-shadow:
      0 1px 2px rgba(13,59,110,0.06),
      0 24px 48px -20px rgba(13,59,110,0.35);
    overflow:hidden;
    border: 1px solid rgba(13,59,110,0.06);
  }

  /* faixa ondulada no topo, evocando a ponte entre dois idiomas/costas */
  .onda{
    position:absolute;
    top:0; left:0; right:0;
    height: 86px;
    background: linear-gradient(135deg, var(--azul-deep), var(--azul) 60%, var(--teal));
  }
  .onda svg{
    position:absolute;
    bottom:-1px; left:0;
    width:100%; height:26px;
    display:block;
  }

  .selo{
    position:relative;
    z-index:2;
    width:118px; height:118px;
    margin: 6px auto 0;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px -8px rgba(8,40,72,0.45);
  }
  .selo img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
  }

  .tagline{
    text-align:center;
    margin-top: 22px;
    font-size: 13.5px;
    line-height:1.55;
    color: var(--tinta-suave);
    padding: 0 6px;
  }
  .tagline .es{
    display:block;
    margin-top:4px;
    font-style: italic;
  }

  .divisor{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 22px 0 18px;
  }
  .divisor::before, .divisor::after{
    content:"";
    flex:1;
    height:1px;
    background: linear-gradient(90deg, transparent, rgba(13,59,110,0.18), transparent);
  }
  .divisor svg{ flex-shrink:0; }

  .contatos{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .linha{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 12px 14px;
    border-radius: 14px;
    text-decoration:none;
    color: var(--tinta);
    background: #fbfaf6;
    border: 1px solid rgba(13,59,110,0.07);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .linha:hover{
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 8px 18px -10px rgba(13,59,110,0.35);
  }

  .icone{
    width:38px; height:38px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background: var(--azul);
    flex-shrink:0;
  }
  .icone svg{ width:19px; height:19px; }

  .txt-linha{ min-width:0; }
  .txt-linha .rotulo{
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing: 1px;
    color: var(--tinta-suave);
    font-weight:700;
  }
  .txt-linha .valor{
    font-size: 14px;
    font-weight:600;
    color: var(--azul-deep);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .salvar{
    margin-top: 20px;
    width:100%;
    padding: 13px;
    border:none;
    border-radius: 14px;
    background: var(--ouro);
    color: var(--azul-deep);
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size: 13.5px;
    letter-spacing:0.3px;
    cursor:pointer;
    transition: filter .15s ease, transform .15s ease;
  }
  .salvar:hover{ filter: brightness(1.05); transform: translateY(-1px); }
  .salvar:active{ transform: translateY(0); }

  .rodape{
    margin-top:16px;
    text-align:center;
    font-size: 10.5px;
    color: var(--tinta-suave);
    letter-spacing:0.3px;
  }

  @media (max-width: 400px){
    .card{ padding: 38px 22px 26px; }
  }
</style>
</head>
